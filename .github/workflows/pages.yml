name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ['Crawl AWS Docs']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.0
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          chmod +x scripts/hugo-build-safe.sh
          scripts/hugo-build-safe.sh "$HUGO_BASEURL"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf pages_artifact
          mkdir -p pages_artifact

          # Copy with dereference to avoid symlinks in the deploy artifact.
          rsync -a --delete --copy-links public/ pages_artifact/

          symlink_path="$(find pages_artifact -type l -print -quit)"
          if [ -n "$symlink_path" ]; then
            echo "::error::Deploy artifact contains a symlink: $symlink_path"
            exit 1
          fi

          hardlink_path="$(find pages_artifact -type f -links +1 -print -quit)"
          if [ -n "$hardlink_path" ]; then
            echo "::error::Deploy artifact contains a hard link: $hardlink_path"
            exit 1
          fi

          size_bytes="$(du -sb pages_artifact | awk '{print $1}')"
          max_bytes=$((10 * 1024 * 1024 * 1024))
          echo "Prepared Pages artifact size: ${size_bytes} bytes"

          if [ "$size_bytes" -ge "$max_bytes" ]; then
            echo "::error::Deploy artifact is too large (${size_bytes} bytes). Limit is ${max_bytes} bytes (10GB)."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
