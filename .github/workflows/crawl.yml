name: Crawl AWS Docs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build crawler
        run: go build -o aws-docs ./cmd/aws-docs

      - name: Run crawler
        run: ./aws-docs -mode=incremental -max-sections=1 -detailed-logging

      - name: Commit crawled docs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ metadata/
          if git diff --cached --quiet; then
            echo "No doc changes to commit"
            exit 0
          fi
          git commit -m "chore(crawl): update docs"

          # Merge remote updates when possible; never overwrite with force push.
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            git pull --no-rebase --no-edit origin main
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (likely concurrent update). Retrying ($attempt/$max_attempts)..."
            attempt=$((attempt + 1))
          done

          echo "Failed to push after $max_attempts attempts without overwriting history"
          exit 1
